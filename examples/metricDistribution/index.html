<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Metric Distribution</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link rel="stylesheet" href="../examples.css" />
        <style>
            .distribution-grid {
                display: grid;
                gap: 2rem;
                grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
                margin: 2rem auto;
                max-width: 1200px;
                width: 90%;
            }

            .distribution-panel {
                border: 1px solid #ddd;
                border-radius: 8px;
                font-family: sans-serif;
                font-size: 14px;
                padding: 12px 16px;
            }

            .distribution-panel h2 {
                color: #5f6368;
                font-size: 12px;
                font-weight: normal;
                margin: 0 0 12px;
            }
        </style>

        <script src="../index.js"></script>
    </head>

    <body>
        <main class="gsm-viz--example">
            <div class="distribution-grid">
                <section class="distribution-panel">
                    <h2>Business labels and status colours</h2>
                    <div id="study-discontinuation"></div>
                </section>
                <section class="distribution-panel">
                    <h2>
                        Multi-value reasons with a top-4 limit; statuses without
                        a colour map
                    </h2>
                    <div id="treatment-discontinuation"></div>
                </section>
                <section class="distribution-panel">
                    <h2>One site, default spec, no screen failures</h2>
                    <div id="screen-failure"></div>
                </section>
                <section class="distribution-panel">
                    <h2>Missing state: no distributions supplied</h2>
                    <div id="missing"></div>
                </section>
                <section class="distribution-panel">
                    <h2>Empty state: no rows</h2>
                    <div id="empty"></div>
                </section>
            </div>
        </main>

        <script src="index.js"></script>
        <script src="../nav.js"></script>
    </body>
</html>
