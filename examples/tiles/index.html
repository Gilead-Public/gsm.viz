<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Tiles</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link rel="stylesheet" href="../examples.css" />
        <style>
            .tiles-example {
                margin: 1rem auto;
                max-width: 1100px;
                width: 90%;
            }

            .tiles-example .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-bottom: 1rem;
            }

            #tiles-status {
                color: #555;
                font-family: monospace;
                margin-top: 1rem;
                white-space: pre-wrap;
            }
        </style>

        <script src="../index.js"></script>
    </head>

    <body>
        <main class="gsm-viz--example tiles-example">
            <p>
                Synthetic participant × vital sign repeat-measurement flags.
                Click a vital sign header to expand it into one column per
                measurement; click a participant to select the row; click a cell
                to inspect its source row.
            </p>
            <div class="controls">
                <span>Label:</span>
                <button type="button" data-label="rate">Rate</button>
                <button type="button" data-label="nd">N/D</button>
                <button type="button" data-label="both">Both</button>
                <span>Sort:</span>
                <button type="button" id="sort-id">Participant</button>
                <button type="button" id="sort-red">Most red flags</button>
                <button type="button" id="clear-selection">
                    Clear selection
                </button>
            </div>
            <div id="tiles-container"></div>
            <div id="tiles-status"></div>
        </main>

        <script src="index.js"></script>
        <script src="../nav.js"></script>
    </body>
</html>
