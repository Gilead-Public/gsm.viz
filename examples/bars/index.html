<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Bars</title>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="../examples.css" />
    <style>
      .tab-nav {
        display: flex;
        gap: 4px;
        padding: 8px 16px 0;
        border-bottom: 2px solid #ccc;
      }
      .tab-nav button {
        padding: 6px 16px;
        border: 1px solid #ccc;
        border-bottom: none;
        background: #f5f5f5;
        cursor: pointer;
        border-radius: 4px 4px 0 0;
        font-size: 14px;
      }
      .tab-nav button.active {
        background: #fff;
        border-bottom: 2px solid #fff;
        margin-bottom: -2px;
        font-weight: bold;
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }
    </style>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="../index.js"></script>
  </head>

  <body>
    <nav class="tab-nav">
      <button class="active" data-tab="kri">KRI by Flag</button>
      <button data-tab="bites">Animal Bites</button>
      <button data-tab="retention">Retention</button>
    </nav>

    <!-- KRI tab -->
    <div id="kri" class="tab-panel active gsm-viz--example">
      <div id="controls">
        <fieldset>
          <legend>Orientation</legend>
          <select id="orientation">
            <option value="vertical" selected>Vertical</option>
            <option value="horizontal">Horizontal</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Fill</legend>
          <select id="fill">
            <option value="">None</option>
            <option value="Flag" selected>Flag</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Position</legend>
          <select id="position">
            <option value="stack" selected>Stack</option>
            <option value="dodge">Dodge</option>
            <!--option value="identity">Identity</option-->
          </select>
        </fieldset>
      </div>

      <div id="kri-container">
        <canvas id="canvas"></canvas>
      </div>
    </div>

    <!-- Animal Bites tab -->
    <div id="bites" class="tab-panel gsm-viz--example">
      <div id="bites-controls">
        <fieldset>
          <legend>Orientation</legend>
          <select id="bites-orientation">
            <option value="vertical">Vertical</option>
            <option value="horizontal" selected>Horizontal</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Position</legend>
          <select id="bites-position">
            <option value="stack">Stack</option>
            <option value="dodge" selected>Dodge</option>
            <!--option value="identity">Identity</option-->
          </select>
        </fieldset>
      </div>

      <div id="bites-container"></div>
    </div>

    <!-- Retention tab -->
    <div id="retention" class="tab-panel gsm-viz--example">
      <div id="retention-controls">
        <fieldset>
          <legend>Orientation</legend>
          <select id="retention-orientation">
            <option value="vertical" selected>Vertical</option>
            <option value="horizontal">Horizontal</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Position</legend>
          <select id="retention-position">
            <option value="stack" selected>Stack</option>
            <option value="dodge">Dodge</option>
            <!--option value="identity">Identity</option-->
          </select>
        </fieldset>
      </div>

      <div id="retention-container"></div>
    </div>

    <script>
      // Tab switching
      const tabButtons = document.querySelectorAll('.tab-nav button');
      const tabPanels = document.querySelectorAll('.tab-panel');
      tabButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          tabButtons.forEach((b) => b.classList.remove('active'));
          tabPanels.forEach((p) => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(btn.dataset.tab).classList.add('active');
        });
      });
    </script>

    <script src="kriChart.js"></script>
    <script src="animalBitesChart.js"></script>
    <script src="retentionChart.js"></script>
    <script src="../nav.js"></script>
  </body>
</html>
