<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bars</title>
        <meta charset="utf-8" />

        <link rel="stylesheet" href="../examples.css" />
        <style>
            .tab-nav {
                display: flex;
                gap: 4px;
                padding: 8px 16px 0;
                border-bottom: 2px solid #ccc;
            }
            .tab-nav button {
                padding: 6px 16px;
                border: 1px solid #ccc;
                border-bottom: none;
                background: #f5f5f5;
                cursor: pointer;
                border-radius: 4px 4px 0 0;
                font-size: 14px;
            }
            .tab-nav button.active {
                background: #fff;
                border-bottom: 2px solid #fff;
                margin-bottom: -2px;
                font-weight: bold;
            }
            .tab-panel {
                display: none;
            }
            .tab-panel.active {
                display: block;
            }
            #kri-hover-table {
                margin: 12px 16px 0;
                font-size: 13px;
            }
            #kri-hover-table table {
                border-collapse: collapse;
                width: 100%;
            }
            #kri-hover-table th,
            #kri-hover-table td {
                border: 1px solid #ddd;
                padding: 4px 10px;
                text-align: left;
            }
            #kri-hover-table th {
                background: #f0f0f0;
                font-weight: bold;
            }
            #kri-hover-table tr:nth-child(even) {
                background: #fafafa;
            }
            #kri-scatter {
                margin: 16px;
                display: none;
            }
            #kri-scatter h4 {
                margin: 0 0 6px;
                font-size: 14px;
            }
            #kri-scatter-container {
                height: 400px;
            }
        </style>

        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="../index.js"></script>

        <script src="../data/helpers/filterOnMetricID.js"></script>
        <script src="../data/helpers/selectMetricID.js"></script>
        <script src="../groupTooltipKeys.js"></script>
    </head>

    <body>
        <nav class="tab-nav">
            <button class="active" data-tab="retention">Retention</button>
            <button data-tab="kri">KRI by Flag</button>
            <button data-tab="gini">World Gini Index</button>
        </nav>

        <!-- Retention tab -->
        <div id="retention" class="tab-panel active gsm-viz--example">
            <div id="retention-controls">
                <fieldset>
                    <legend>Orientation</legend>
                    <select id="retention-orientation">
                        <option value="vertical">Vertical</option>
                        <option value="horizontal" selected>Horizontal</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Position</legend>
                    <select id="retention-position">
                        <option value="stack" selected>Stack</option>
                        <option value="dodge">Dodge</option>
                        <option value="fill">Fill</option>
                        <!--option value="identity">Identity</option-->
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Dynamic Sizing</legend>
                    <select id="retention-dynamic-sizing">
                        <option value="no">No</option>
                        <option value="yes" selected>Yes</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Dynamic Category Axis</legend>
                    <select id="retention-dynamic-category-axis">
                        <option value="no">No</option>
                        <option value="yes" selected>Yes</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Annotations</legend>
                    <select id="retention-annotations">
                        <option value="none">None</option>
                        <option value="total-outside" selected>Total (outside)</option>
                        <option value="total-inside">Total (inside)</option>
                        <option value="segment-outside">Segment (outside)</option>
                        <option value="segment-inside">Segment (inside)</option>
                    </select>
                </fieldset>
            </div>

            <div id="retention-container"></div>
        </div>

        <!-- KRI tab -->
        <div id="kri" class="tab-panel gsm-viz--example">
            <div id="controls">
                <fieldset>
                    <legend>Orientation</legend>
                    <select id="orientation">
                        <option value="vertical" selected>Vertical</option>
                        <option value="horizontal">Horizontal</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Position</legend>
                    <select id="position">
                        <option value="stack" selected>Stack</option>
                        <option value="dodge">Dodge</option>
                        <option value="fill">Fill</option>
                        <!--option value="identity">Identity</option-->
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Dynamic Sizing</legend>
                    <select id="dynamic-sizing">
                        <option value="no" selected>No</option>
                        <option value="yes">Yes</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Dynamic Category Axis</legend>
                    <select id="dynamic-category-axis">
                        <option value="no" selected>No</option>
                        <option value="yes">Yes</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Fill</legend>
                    <select id="fill">
                        <option value="">None</option>
                        <option value="Flag" selected>Flag</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Annotations</legend>
                    <select id="kri-annotations">
                        <option value="none">None</option>
                        <option value="total-outside" selected>Total (outside)</option>
                        <option value="total-inside">Total (inside)</option>
                        <option value="segment-outside">Segment (outside)</option>
                        <option value="segment-inside">Segment (inside)</option>
                    </select>
                </fieldset>
            </div>

            <div id="kri-container">
                <canvas id="canvas"></canvas>
            </div>

            <div id="kri-hover-table"></div>

            <div id="kri-scatter">
                <h4></h4>
                <div id="kri-scatter-container"></div>
            </div>
        </div>

        <!-- World Gini Index tab -->
        <div id="gini" class="tab-panel gsm-viz--example">
            <div id="gini-controls">
                <fieldset>
                    <legend>Orientation</legend>
                    <select id="gini-orientation">
                        <option value="vertical" selected>Vertical</option>
                        <option value="horizontal">Horizontal</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Position</legend>
                    <select id="gini-position">
                        <option value="stack" selected>Stack</option>
                        <option value="dodge">Dodge</option>
                        <option value="fill">Fill</option>
                        <!--option value="identity">Identity</option-->
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Dynamic Sizing</legend>
                    <select id="gini-dynamic-sizing">
                        <option value="no" selected>No</option>
                        <option value="yes">Yes</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Year</legend>
                    <select id="gini-year"></select>
                </fieldset>

                <fieldset>
                    <legend>Annotations</legend>
                    <select id="gini-annotations">
                        <option value="none">None</option>
                        <option value="total-outside" selected>Total (outside)</option>
                        <option value="total-inside">Total (inside)</option>
                        <option value="segment-outside">Segment (outside)</option>
                        <option value="segment-inside">Segment (inside)</option>
                    </select>
                </fieldset>
            </div>

            <div id="gini-container"></div>
        </div>

        <script>
            // Tab switching
            const tabButtons = document.querySelectorAll('.tab-nav button');
            const tabPanels = document.querySelectorAll('.tab-panel');
            tabButtons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    tabButtons.forEach((b) => b.classList.remove('active'));
                    tabPanels.forEach((p) => p.classList.remove('active'));
                    btn.classList.add('active');
                    document
                        .getElementById(btn.dataset.tab)
                        .classList.add('active');
                });
            });
        </script>

        <script src="controls.js"></script>
        <script src="retentionChart.js"></script>
        <script src="kriChart.js"></script>
        <script src="giniChart.js"></script>
        <script src="../nav.js"></script>
    </body>
</html>
