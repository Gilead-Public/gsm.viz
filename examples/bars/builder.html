<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bar Chart Builder — Bars</title>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="../examples.css" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    sans-serif;
                font-size: 13px;
                color: #24292f;
                background: #fff;
            }

            /* ── Two-panel layout ── */
            .builder-layout {
                display: flex;
                height: 100vh;
                overflow: hidden;
            }

            .builder-sidebar {
                width: 260px;
                flex-shrink: 0;
                background: #f6f8fa;
                border-right: 1px solid #d0d7de;
                overflow-y: auto;
                padding: 12px 10px 24px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .builder-title {
                font-size: 15px;
                font-weight: 700;
                color: #24292f;
                margin: 0 0 2px;
            }

            .builder-chart-area {
                flex: 1;
                min-width: 0;
                /* Scroll in both axes so dynamic sizing can grow the chart
                   beyond the viewport in either direction. */
                overflow: auto;
                padding: 16px;
            }

            /* ── Collapsible sidebar sections ── */
            details.sidebar-section {
                border: 1px solid #d0d7de;
                border-radius: 6px;
                background: #fff;
                padding: 0;
            }

            summary.sidebar-section-title {
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #57606a;
                padding: 8px 10px;
                cursor: pointer;
                user-select: none;
                list-style: none;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            summary.sidebar-section-title::-webkit-details-marker {
                display: none;
            }

            summary.sidebar-section-title::after {
                content: '▸';
                font-size: 10px;
                color: #8c959f;
                transition: transform 0.15s ease;
            }

            details[open] > summary.sidebar-section-title::after {
                transform: rotate(90deg);
            }

            .section-body {
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 0 10px 10px;
            }

            .sidebar-row {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .sidebar-row label {
                font-size: 11px;
                color: #57606a;
                font-weight: 600;
            }

            .sidebar-row select,
            .sidebar-row input[type='number'],
            .sidebar-row input[type='text'] {
                width: 100%;
                font-size: 12px;
                padding: 3px 5px;
                border: 1px solid #d0d7de;
                border-radius: 4px;
                background: #fff;
                color: #24292f;
            }

            .sidebar-row select:disabled,
            .sidebar-row input:disabled {
                background: #f6f8fa;
                color: #8c959f;
                cursor: not-allowed;
            }

            /* ── Dataset row (dropdown + file button inline) ── */
            .dataset-row {
                display: flex;
                gap: 6px;
                align-items: center;
            }

            .dataset-row select {
                flex: 1;
                min-width: 0;
                font-size: 12px;
                padding: 3px 5px;
                border: 1px solid #d0d7de;
                border-radius: 4px;
                background: #fff;
                color: #24292f;
            }

            .btn-load-csv {
                flex-shrink: 0;
                font-size: 11px;
                padding: 4px 8px;
                border: 1px solid #d0d7de;
                border-radius: 4px;
                background: #f6f8fa;
                cursor: pointer;
                white-space: nowrap;
                color: #24292f;
            }

            .btn-load-csv:hover {
                background: #eaeef2;
                border-color: #8c959f;
            }

            #csv-file-input {
                display: none;
            }

            /* ── Export buttons ── */
            .export-row {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .btn-export {
                width: 100%;
                font-size: 12px;
                padding: 6px 10px;
                border: 1px solid #0969da;
                border-radius: 4px;
                background: #0969da;
                color: #fff;
                cursor: pointer;
                font-weight: 600;
            }

            .btn-export:hover {
                background: #0860ca;
            }

            .btn-export-spec {
                width: 100%;
                font-size: 12px;
                padding: 6px 10px;
                border: 1px solid #d0d7de;
                border-radius: 4px;
                background: #f6f8fa;
                color: #24292f;
                cursor: pointer;
                font-weight: 600;
            }

            .btn-export-spec:hover {
                background: #eaeef2;
                border-color: #8c959f;
            }

            /* ── Fill order drag-and-drop list ── */
            .fill-order-list {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                gap: 3px;
            }

            .fill-order-item {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                padding: 4px 6px;
                border: 1px solid #d0d7de;
                border-radius: 4px;
                background: #fff;
                color: #24292f;
                cursor: grab;
            }

            .fill-order-item.dragging {
                opacity: 0.4;
            }

            .fill-order-item.drag-over {
                border-color: #0969da;
                box-shadow: inset 0 0 0 1px #0969da;
            }

            .fill-order-handle {
                color: #8c959f;
                flex-shrink: 0;
                line-height: 1;
            }

            .fill-order-label {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .fill-order-empty {
                font-size: 11px;
                color: #8c959f;
                font-style: italic;
            }

            /* ── Dynamic filter fieldsets ── */
            .filter-fieldset {
                border: 1px solid #d0d7de;
                border-radius: 4px;
                padding: 4px 6px 6px;
                margin: 0;
            }

            .filter-fieldset legend {
                font-size: 10px;
                font-weight: 700;
                color: #57606a;
                padding: 0 3px;
            }

            .filter-multiselect {
                width: 100%;
                font-size: 11px;
                border: 1px solid #d0d7de;
                border-radius: 3px;
            }

            .range-display {
                font-size: 10px;
                color: #57606a;
                text-align: center;
                margin-bottom: 2px;
            }

            .range-slider {
                width: 100%;
                accent-color: #0969da;
            }

            /* ── Chart container ── */
            /* Default min-height used when dynamicSizing is off; grows to fit
               taller facet grids instead of overflowing onto the Spec panel.
               bars.js overrides el.style.height (horizontal) or
               el.style.width (vertical) when dynamicSizing is on,
               so this must NOT be controlled by flex-grow. */
            #chart-container {
                min-height: 500px;
                width: 100%;
            }

            /* ── Error message ── */
            .builder-error {
                color: #cf222e;
                font-size: 13px;
                padding: 12px;
                background: #ffebe9;
                border: 1px solid #ff8182;
                border-radius: 4px;
            }

            /* ── Status bar ── */
            .builder-status {
                font-size: 11px;
                color: #57606a;
                margin-bottom: 8px;
                min-height: 16px;
            }

            /* ── Live spec display ── */
            .spec-panel {
                margin-top: 16px;
            }

            .spec-panel-header {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 6px;
            }

            .spec-panel-title {
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #57606a;
                margin: 0;
            }

            .spec-format-toggle {
                display: flex;
                border: 1px solid #d0d7de;
                border-radius: 6px;
                overflow: hidden;
            }

            .spec-format-toggle button {
                padding: 2px 8px;
                font-size: 11px;
                font-weight: 600;
                background: #f6f8fa;
                border: none;
                cursor: pointer;
                color: #57606a;
                line-height: 1.5;
            }

            .spec-format-toggle button + button {
                border-left: 1px solid #d0d7de;
            }

            .spec-format-toggle button.active {
                background: #0969da;
                color: #ffffff;
            }

            .spec-format-toggle button:not(.active):hover {
                background: #e8edf1;
            }

            .spec-code {
                margin: 0;
                padding: 12px 14px;
                background: #f6f8fa;
                border: 1px solid #d0d7de;
                border-radius: 6px;
                overflow-x: auto;
                font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo,
                    Consolas, 'Liberation Mono', monospace;
                font-size: 12px;
                line-height: 1.45;
                color: #24292f;
                white-space: pre;
                tab-size: 4;
            }
        </style>

        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
        <script src="../index.js"></script>
    </head>

    <body>
        <div class="builder-layout">
            <!-- ── Left sidebar ── -->
            <aside class="builder-sidebar">
                <h1 class="builder-title">Bar Chart Builder</h1>

                <!-- Dataset -->
                <details class="sidebar-section" open>
                    <summary class="sidebar-section-title">Dataset</summary>
                    <div class="section-body">
                        <div class="dataset-row">
                            <select
                                id="dataset-select"
                                title="Select a dataset"
                            ></select>
                            <button
                                class="btn-load-csv"
                                title="Load a custom CSV file"
                                onclick="document.getElementById('csv-file-input').click()"
                            >
                                Load CSV
                            </button>
                            <input
                                type="file"
                                id="csv-file-input"
                                accept=".csv"
                            />
                        </div>
                    </div>
                </details>

                <!-- Mapping -->
                <details class="sidebar-section" open>
                    <summary class="sidebar-section-title">Mapping</summary>
                    <div class="section-body">
                        <div class="sidebar-row">
                            <label for="mapping-x">X (category)</label>
                            <select id="mapping-x"></select>
                        </div>

                        <div class="sidebar-row">
                            <label for="mapping-y">Y (continuous)</label>
                            <select id="mapping-y">
                                <option value="">(count)</option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-y-agg">Y Aggregation</label>
                            <select
                                id="settings-y-agg"
                                disabled
                                title="Select a Y variable to enable aggregation"
                            >
                                <option value="identity" selected>
                                    Identity
                                </option>
                                <option value="mean">Mean</option>
                                <option value="min">Min</option>
                                <option value="median">Median</option>
                                <option value="max">Max</option>
                                <option value="sd">Std Dev</option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="mapping-fill">Fill (group)</label>
                            <select id="mapping-fill">
                                <option value="">(none)</option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="mapping-facet">Facet</label>
                            <select id="mapping-facet">
                                <option value="">(none)</option>
                            </select>
                        </div>
                    </div>
                </details>

                <!-- Appearance -->
                <details class="sidebar-section">
                    <summary class="sidebar-section-title">Appearance</summary>
                    <div class="section-body">
                        <div class="sidebar-row">
                            <label for="settings-orientation"
                                >Orientation</label
                            >
                            <select id="settings-orientation">
                                <option value="vertical" selected>
                                    Vertical
                                </option>
                                <option value="horizontal">Horizontal</option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-position">Position</label>
                            <select id="settings-position">
                                <option value="stack" selected>Stack</option>
                                <option value="dodge">Dodge</option>
                                <option value="identity">Identity</option>
                                <option value="fill">Fill (100%)</option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-annotations"
                                >Annotations</label
                            >
                            <select id="settings-annotations">
                                <option value="none" selected>None</option>
                                <option value="total-outside">
                                    Total (outside)
                                </option>
                                <option value="total-inside">
                                    Total (inside)
                                </option>
                                <option value="segment-outside">
                                    Segment (outside)
                                </option>
                                <option value="segment-inside">
                                    Segment (inside)
                                </option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-bar-label">Bar Label</label>
                            <select id="settings-bar-label">
                                <option value="none" selected>None</option>
                                <option value="count">Count</option>
                                <option value="percent">Percent</option>
                                <option value="fill">Fill</option>
                                <option value="category">Category</option>
                                <option value="custom">Custom</option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-legend-position">Legend</label>
                            <select id="settings-legend-position">
                                <option value="top" selected>Top</option>
                                <option value="right">Right</option>
                                <option value="bottom">Bottom</option>
                                <option value="left">Left</option>
                                <option value="none">None</option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-dynamic-sizing"
                                >Dynamic Sizing</label
                            >
                            <select id="settings-dynamic-sizing">
                                <option value="no" selected>No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-dynamic-category-axis"
                                >Dynamic Category Axis</label
                            >
                            <select id="settings-dynamic-category-axis">
                                <option value="no" selected>No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>
                    </div>
                </details>

                <!-- Axes & Sorting -->
                <details class="sidebar-section">
                    <summary class="sidebar-section-title">
                        Axes &amp; Sorting
                    </summary>
                    <div class="section-body">
                        <div class="sidebar-row">
                            <label for="settings-x-sort">Sort By</label>
                            <select id="settings-x-sort">
                                <option value="" selected>Alphanumeric</option>
                                <option value="total">Total</option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-x-sort-dir"
                                >Sort Direction</label
                            >
                            <select id="settings-x-sort-dir">
                                <option value="asc" selected>Ascending</option>
                                <option value="desc">Descending</option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-tooltip-format"
                                >Tooltip Format</label
                            >
                            <select id="settings-tooltip-format">
                                <option value="" selected>(default)</option>
                                <option value="count">Count</option>
                                <option value="percent">Percent</option>
                                <option value="count+percent">
                                    Count + Percent
                                </option>
                                <option value="percent+count">
                                    Percent + Count
                                </option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-n-categories"
                                >Top N Categories</label
                            >
                            <input
                                type="number"
                                id="settings-n-categories"
                                min="1"
                                step="1"
                                placeholder="All"
                            />
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-y-min">Y Axis Min</label>
                            <input
                                type="number"
                                id="settings-y-min"
                                step="any"
                                placeholder="Auto"
                            />
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-y-max">Y Axis Max</label>
                            <input
                                type="number"
                                id="settings-y-max"
                                step="any"
                                placeholder="Auto"
                            />
                        </div>
                    </div>
                </details>

                <!-- Facets -->
                <details class="sidebar-section">
                    <summary class="sidebar-section-title">Facets</summary>
                    <div class="section-body">
                        <div class="sidebar-row">
                            <label for="settings-facet-ncol"
                                >Facet Columns</label
                            >
                            <input
                                type="number"
                                id="settings-facet-ncol"
                                min="1"
                                step="1"
                                placeholder="Auto"
                                disabled
                                title="Select a Facet variable to enable"
                            />
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-facet-height"
                                >Facet Height (px)</label
                            >
                            <input
                                type="number"
                                id="settings-facet-height"
                                min="50"
                                step="10"
                                placeholder="Auto"
                                disabled
                                title="Select a Facet variable to enable"
                            />
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-facet-y-scale"
                                >Facet Y Scale</label
                            >
                            <select
                                id="settings-facet-y-scale"
                                disabled
                                title="Select a Facet variable to enable"
                            >
                                <option value="constant" selected>
                                    Constant
                                </option>
                                <option value="free">Free</option>
                            </select>
                        </div>

                        <div class="sidebar-row">
                            <label for="settings-facet-x-scale"
                                >Facet X Scale</label
                            >
                            <select
                                id="settings-facet-x-scale"
                                disabled
                                title="Select a Facet variable to enable"
                            >
                                <option value="constant" selected>
                                    Constant
                                </option>
                                <option value="free">Free</option>
                            </select>
                        </div>
                    </div>
                </details>

                <!-- Labels -->
                <details class="sidebar-section">
                    <summary class="sidebar-section-title">Labels</summary>
                    <div class="section-body">
                        <div class="sidebar-row">
                            <label for="label-title">Title</label>
                            <input
                                type="text"
                                id="label-title"
                                placeholder="(none)"
                            />
                        </div>

                        <div class="sidebar-row">
                            <label for="label-caption"
                                >Caption / Footnote</label
                            >
                            <input
                                type="text"
                                id="label-caption"
                                placeholder="(none)"
                            />
                        </div>

                        <div class="sidebar-row">
                            <label for="label-x">X-Axis Label</label>
                            <input
                                type="text"
                                id="label-x"
                                placeholder="(default)"
                            />
                        </div>

                        <div class="sidebar-row">
                            <label for="label-y">Y-Axis Label</label>
                            <input
                                type="text"
                                id="label-y"
                                placeholder="(default)"
                            />
                        </div>

                        <div class="sidebar-row">
                            <label for="label-legend">Legend Title</label>
                            <input
                                type="text"
                                id="label-legend"
                                placeholder="(default)"
                                title="Only applies when a Fill variable is selected"
                            />
                        </div>
                    </div>
                </details>

                <!-- Fill Order -->
                <details class="sidebar-section" id="fill-order-section" open>
                    <summary class="sidebar-section-title">Fill Order</summary>
                    <div class="section-body">
                        <div id="fill-order-container"></div>
                    </div>
                </details>

                <!-- Export -->
                <div class="export-row">
                    <button class="btn-export" id="export-btn">
                        Export PNG
                    </button>
                    <button class="btn-export-spec" id="export-spec-btn">
                        Export Spec
                    </button>
                </div>

                <!-- Filters -->
                <details class="sidebar-section">
                    <summary class="sidebar-section-title">Filters</summary>
                    <div class="section-body">
                        <div id="filters-container"></div>
                    </div>
                </details>
            </aside>

            <!-- ── Chart area ── -->
            <main class="builder-chart-area">
                <div class="builder-status" id="builder-status"></div>
                <div id="chart-container"></div>

                <!-- Live spec display (matches the Export Spec output) -->
                <section class="spec-panel">
                    <div class="spec-panel-header">
                        <h2 class="spec-panel-title">Spec</h2>
                        <div class="spec-format-toggle">
                            <button
                                id="spec-format-js"
                                class="active"
                                title="Show JavaScript call"
                            >
                                JS
                            </button>
                            <button
                                id="spec-format-yaml"
                                title="Show YAML spec"
                            >
                                YAML
                            </button>
                        </div>
                    </div>
                    <pre class="spec-code"><code id="spec-display"></code></pre>
                </section>
            </main>
        </div>

        <script src="builder.js"></script>
        <script src="../nav.js"></script>
    </body>
</html>
