<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Data Explorer — Bars</title>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="../examples.css" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    sans-serif;
                font-size: 13px;
                color: #24292f;
                background: #fff;
            }

            /* ── Two-panel layout ── */
            .explorer-layout {
                display: flex;
                height: 100vh;
                overflow: hidden;
            }

            .explorer-sidebar {
                width: 240px;
                flex-shrink: 0;
                background: #f6f8fa;
                border-right: 1px solid #d0d7de;
                overflow-y: auto;
                padding: 12px 10px 24px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }

            .explorer-chart-area {
                flex: 1;
                min-width: 0;
                /* Scroll in both axes so dynamic sizing can grow the chart
                   beyond the viewport in either direction. */
                overflow: auto;
                padding: 16px;
            }

            /* ── Sidebar sections ── */
            .sidebar-section {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .sidebar-section-title {
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #57606a;
                padding-bottom: 4px;
                border-bottom: 1px solid #d0d7de;
            }

            .sidebar-row {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .sidebar-row label {
                font-size: 11px;
                color: #57606a;
                font-weight: 600;
            }

            .sidebar-row select,
            .sidebar-row input[type='number'] {
                width: 100%;
                font-size: 12px;
                padding: 3px 5px;
                border: 1px solid #d0d7de;
                border-radius: 4px;
                background: #fff;
                color: #24292f;
            }

            .sidebar-row select:disabled,
            .sidebar-row input:disabled {
                background: #f6f8fa;
                color: #8c959f;
                cursor: not-allowed;
            }

            /* ── Dataset row (dropdown + file button inline) ── */
            .dataset-row {
                display: flex;
                gap: 6px;
                align-items: center;
            }

            .dataset-row select {
                flex: 1;
                min-width: 0;
                font-size: 12px;
                padding: 3px 5px;
                border: 1px solid #d0d7de;
                border-radius: 4px;
                background: #fff;
                color: #24292f;
            }

            .btn-load-csv {
                flex-shrink: 0;
                font-size: 11px;
                padding: 4px 8px;
                border: 1px solid #d0d7de;
                border-radius: 4px;
                background: #f6f8fa;
                cursor: pointer;
                white-space: nowrap;
                color: #24292f;
            }

            .btn-load-csv:hover {
                background: #eaeef2;
                border-color: #8c959f;
            }

            #csv-file-input {
                display: none;
            }

            /* ── Export button ── */
            .btn-export {
                width: 100%;
                font-size: 12px;
                padding: 6px 10px;
                border: 1px solid #0969da;
                border-radius: 4px;
                background: #0969da;
                color: #fff;
                cursor: pointer;
                font-weight: 600;
            }

            .btn-export:hover {
                background: #0860ca;
            }

            /* ── Dynamic filter fieldsets ── */
            .filter-fieldset {
                border: 1px solid #d0d7de;
                border-radius: 4px;
                padding: 4px 6px 6px;
                margin: 0;
            }

            .filter-fieldset legend {
                font-size: 10px;
                font-weight: 700;
                color: #57606a;
                padding: 0 3px;
            }

            .filter-multiselect {
                width: 100%;
                font-size: 11px;
                border: 1px solid #d0d7de;
                border-radius: 3px;
            }

            .range-display {
                font-size: 10px;
                color: #57606a;
                text-align: center;
                margin-bottom: 2px;
            }

            .range-slider {
                width: 100%;
                accent-color: #0969da;
            }

            /* ── Chart container ── */
            /* Default height used when dynamicSizing is off.
               bars.js overrides el.style.height (horizontal) or
               el.style.width (vertical) when dynamicSizing is on,
               so this must NOT be controlled by flex-grow. */
            #chart-container {
                height: 500px;
                width: 100%;
            }

            /* ── Error message ── */
            .explorer-error {
                color: #cf222e;
                font-size: 13px;
                padding: 12px;
                background: #ffebe9;
                border: 1px solid #ff8182;
                border-radius: 4px;
            }

            /* ── Status bar ── */
            .explorer-status {
                font-size: 11px;
                color: #57606a;
                margin-bottom: 8px;
                min-height: 16px;
            }
        </style>

        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="../index.js"></script>
    </head>

    <body>
        <div class="explorer-layout">
            <!-- ── Left sidebar ── -->
            <aside class="explorer-sidebar">
                <!-- Dataset -->
                <div class="sidebar-section">
                    <div class="sidebar-section-title">Dataset</div>
                    <div class="dataset-row">
                        <select id="dataset-select" title="Select a dataset"></select>
                        <button
                            class="btn-load-csv"
                            title="Load a custom CSV file"
                            onclick="document.getElementById('csv-file-input').click()"
                        >
                            Load CSV
                        </button>
                        <input type="file" id="csv-file-input" accept=".csv" />
                    </div>
                </div>

                <!-- Mapping -->
                <div class="sidebar-section">
                    <div class="sidebar-section-title">Mapping</div>

                    <div class="sidebar-row">
                        <label for="mapping-x">X (category)</label>
                        <select id="mapping-x"></select>
                    </div>

                    <div class="sidebar-row">
                        <label for="mapping-y">Y (continuous)</label>
                        <select id="mapping-y">
                            <option value="">(count)</option>
                        </select>
                    </div>

                    <div class="sidebar-row">
                        <label for="settings-y-agg">Y Aggregation</label>
                        <select id="settings-y-agg" disabled title="Select a Y variable to enable aggregation">
                            <option value="mean">Mean</option>
                            <option value="min">Min</option>
                            <option value="median">Median</option>
                            <option value="max">Max</option>
                            <option value="sd">Std Dev</option>
                        </select>
                    </div>

                    <div class="sidebar-row">
                        <label for="mapping-fill">Fill (group)</label>
                        <select id="mapping-fill">
                            <option value="">(none)</option>
                        </select>
                    </div>

                    <div class="sidebar-row">
                        <label for="mapping-facet">Facet</label>
                        <select id="mapping-facet">
                            <option value="">(none)</option>
                        </select>
                    </div>
                </div>

                <!-- Chart Settings -->
                <div class="sidebar-section">
                    <div class="sidebar-section-title">Settings</div>

                    <div class="sidebar-row">
                        <label for="settings-orientation">Orientation</label>
                        <select id="settings-orientation">
                            <option value="vertical" selected>Vertical</option>
                            <option value="horizontal">Horizontal</option>
                        </select>
                    </div>

                    <div class="sidebar-row">
                        <label for="settings-position">Position</label>
                        <select id="settings-position">
                            <option value="stack" selected>Stack</option>
                            <option value="dodge">Dodge</option>
                            <option value="fill">Fill (100%)</option>
                        </select>
                    </div>

                    <div class="sidebar-row">
                        <label for="settings-dynamic-sizing"
                            >Dynamic Sizing</label
                        >
                        <select id="settings-dynamic-sizing">
                            <option value="no" selected>No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>

                    <div class="sidebar-row">
                        <label for="settings-dynamic-category-axis"
                            >Dynamic Category Axis</label
                        >
                        <select id="settings-dynamic-category-axis">
                            <option value="no" selected>No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>

                    <div class="sidebar-row">
                        <label for="settings-annotations">Annotations</label>
                        <select id="settings-annotations">
                            <option value="none" selected>None</option>
                            <option value="total-outside">
                                Total (outside)
                            </option>
                            <option value="total-inside">Total (inside)</option>
                            <option value="segment-outside">
                                Segment (outside)
                            </option>
                            <option value="segment-inside">
                                Segment (inside)
                            </option>
                        </select>
                    </div>

                    <div class="sidebar-row">
                        <label for="settings-bar-label">Bar Label</label>
                        <select id="settings-bar-label">
                            <option value="none" selected>None</option>
                            <option value="count">Count</option>
                            <option value="percent">Percent</option>
                            <option value="fill">Fill</option>
                            <option value="category">Category</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>

                    <div class="sidebar-row">
                        <label for="settings-n-categories"
                            >Top N Categories</label
                        >
                        <input
                            type="number"
                            id="settings-n-categories"
                            min="1"
                            step="1"
                            placeholder="All"
                        />
                    </div>

                    <div class="sidebar-row">
                        <label for="settings-legend-position">Legend</label>
                        <select id="settings-legend-position">
                            <option value="top" selected>Top</option>
                            <option value="bottom">Bottom</option>
                            <option value="none">None</option>
                        </select>
                    </div>

                    <div class="sidebar-row">
                        <label for="settings-facet-ncol">Facet Columns</label>
                        <input
                            type="number"
                            id="settings-facet-ncol"
                            min="1"
                            step="1"
                            placeholder="Auto"
                            disabled
                            title="Select a Facet variable to enable"
                        />
                    </div>

                    <div class="sidebar-row">
                        <label for="settings-facet-height"
                            >Facet Height (px)</label
                        >
                        <input
                            type="number"
                            id="settings-facet-height"
                            min="50"
                            step="10"
                            placeholder="Auto"
                            disabled
                            title="Select a Facet variable to enable"
                        />
                    </div>
                </div>

                <!-- Export -->
                <div class="sidebar-section">
                    <button class="btn-export" id="export-btn">
                        Export PNG
                    </button>
                </div>

                <!-- Dynamic Filters -->
                <div class="sidebar-section">
                    <div class="sidebar-section-title">Filters</div>
                    <div id="filters-container"></div>
                </div>
            </aside>

            <!-- ── Chart area ── -->
            <main class="explorer-chart-area">
                <div class="explorer-status" id="explorer-status"></div>
                <div id="chart-container"></div>
            </main>
        </div>

        <script src="explorer.js"></script>
        <script src="../nav.js"></script>
    </body>
</html>
