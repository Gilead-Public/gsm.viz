<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Metric Overview</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link rel="stylesheet" href="../examples.css" />
        <link rel="stylesheet" href="style.css" />

        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="../index.js"></script>
    </head>

    <body>
        <main class="gsm-viz--example">
            <div id="controls">
                <fieldset>
                    <legend>Metric</legend>
                    <select id="metric"></select>
                </fieldset>
                <fieldset>
                    <legend>Group</legend>
                    <select id="group"></select>
                </fieldset>
                <fieldset>
                    <legend>Snapshot</legend>
                    <select id="snapshot"></select>
                </fieldset>
                <fieldset>
                    <legend>Metric format</legend>
                    <input id="metric-format" type="text" value=",.1%" />
                </fieldset>
            </div>

            <div class="overview-panels">
                <section>
                    <h2>List layout</h2>
                    <div id="overview-list" class="tile"></div>
                </section>
                <section>
                    <h2>Header layout</h2>
                    <div id="overview-header" class="tile"></div>
                </section>
                <section>
                    <h2>Input rows</h2>
                    <p class="note">
                        The selected Reporting_Results row and the labels of its
                        Reporting_Metrics row, for visual comparison.
                    </p>
                    <table id="input-rows"></table>
                </section>
            </div>

            <h2 class="states-title">States (simulated rows)</h2>
            <div id="states" class="overview-panels"></div>
        </main>

        <script src="index.js"></script>
        <script src="../nav.js"></script>
    </body>
</html>
