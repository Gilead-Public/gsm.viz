<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Chart.js Bar Chart with Zoom</title>
        <!-- Uses the gsm.viz bundle which includes chartjs-plugin-zoom -->
        <script src="../../index.js"></script>
    </head>
    <body>
        <div style="width: 800px; height: 400px; margin: auto">
            <div id="zoom-chart"></div>
            <button onclick="resetZoom()">Reset Zoom</button>
        </div>

        <script>
            const data = [
                { month: 'Jan', sales: 12 },
                { month: 'Feb', sales: 19 },
                { month: 'Mar', sales: 3 },
                { month: 'Apr', sales: 5 },
                { month: 'May', sales: 2 },
                { month: 'Jun', sales: 3 },
                { month: 'Jul', sales: 15 },
                { month: 'Aug', sales: 8 },
                { month: 'Sep', sales: 11 },
                { month: 'Oct', sales: 6 },
                { month: 'Nov', sales: 9 },
                { month: 'Dec', sales: 14 },
            ];

            const chart = gsmViz.default.bars('#zoom-chart', data, {
                mapping: { x: 'month', y: 'sales' },
                zoom: {
                    enabled: true,
                    mode: 'x',
                },
                labels: { title: 'Monthly Sales — Zoom & Pan Demo' },
            });

            function resetZoom() {
                chart.resetZoom();
            }
        </script>
    </body>
</html>
