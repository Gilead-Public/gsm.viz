<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Points</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link rel="stylesheet" href="../examples.css" />
        <style>
            #points-container {
                height: 70vh;
                margin: 2rem auto;
                max-width: 960px;
                width: 90%;
            }

            .selection-controls {
                margin: 1rem auto;
                max-width: 960px;
                width: 90%;
            }
        </style>

        <script src="../index.js"></script>
    </head>

    <body>
        <main class="gsm-viz--example">
            <div class="selection-controls">
                <p>
                    Click points or focus the chart and use the arrow keys plus
                    Enter to select multiple sites.
                </p>
                <button id="select-europe" type="button">Select Europe</button>
                <button id="clear-selection" type="button">
                    Clear selection
                </button>
            </div>
            <div id="points-container"></div>
        </main>

        <script src="index.js"></script>
        <script src="../nav.js"></script>
    </body>
</html>
