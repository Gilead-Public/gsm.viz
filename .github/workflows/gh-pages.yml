# =============================================================================
# Build and Deploy — GitHub Pages
# =============================================================================
#
# Deploys the `examples/` directory to the `gh-pages` branch. Three deployment
# targets exist depending on the trigger:
#
#   1. Root (/)          — production; updated on push/merge to `main`
#   2. /dev              — dev staging; updated on push/merge to `dev`
#   3. /pr-{number}      — ephemeral PR previews for PRs targeting `dev`
#
# PR preview lifecycle:
#   - Created/updated when a PR targeting `dev` is opened or pushed to
#   - A comment with the preview URL is posted on the first deploy and
#     updated in-place on subsequent pushes (no duplicate comments)
#   - Cleaned up (folder deleted from gh-pages) when the PR is closed
#
# =============================================================================

name: Build and Deploy

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
# - pull_request: fires on PR open/update/reopen/close against dev or main
# - push: fires on direct pushes (including merged PRs) to dev or main
on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main
      - dev

# ---------------------------------------------------------------------------
# Permissions
# ---------------------------------------------------------------------------
# - contents:write       — push to gh-pages branch
# - pages:write          — GitHub Pages deployment metadata
# - id-token:write       — OIDC token for Pages (required by newer Pages)
# - pull-requests:write  — post/update PR comments with preview URLs
permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  build-and-deploy:
    # Concurrency key prevents parallel deploys to the same ref, which would
    # race on the gh-pages branch and potentially corrupt it.
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout source code
      # -----------------------------------------------------------------------
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Node.js with npm caching for faster installs
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # -----------------------------------------------------------------------
      # 3. Install dependencies and run the full build pipeline
      #    (bundle → format → test → link-bundles)
      # -----------------------------------------------------------------------
      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      # -----------------------------------------------------------------------
      # 4. Stamp the deployment timestamp into examples/index.html
      #    The HTML contains a DEPLOYMENT_TIMESTAMP_PLACEHOLDER string that
      #    gets replaced with the current ISO timestamp so users can see
      #    when the site was last deployed.
      # -----------------------------------------------------------------------
      - name: Update deployment timestamp
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('examples/index.html', 'utf8');
            fs.writeFileSync(
              'examples/index.html',
              html.replace('DEPLOYMENT_TIMESTAMP_PLACEHOLDER', new Date().toISOString())
            );
          "

      # -----------------------------------------------------------------------
      # 5. PRODUCTION DEPLOY — push/merge to main → deploy to root (/)
      #
      #    Triggers on:
      #      a) A PR merged into main (pull_request.closed + merged == true)
      #      b) A direct push to main
      #
      #    clean:false preserves other deployments (/dev, /pr-*) that live
      #    alongside the root content on the gh-pages branch.
      # -----------------------------------------------------------------------
      - name: Deploy to main (root /) 🚀
        if: |
          (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: examples
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false

      # -----------------------------------------------------------------------
      # 6. DEV STAGING DEPLOY — push/merge to dev → deploy to /dev
      #
      #    Same logic as production but targets the /dev subdirectory.
      #    This gives a stable preview of the dev branch at:
      #      https://<owner>.github.io/<repo>/dev/
      # -----------------------------------------------------------------------
      - name: Deploy to dev (/dev) 🚀
        if: |
          (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: examples
          target-folder: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false

      # -----------------------------------------------------------------------
      # 7. PR PREVIEW DEPLOY — open/updated PRs to dev → deploy to /pr-{number}
      #
      #    Every PR targeting dev gets its own subdirectory so reviewers can
      #    preview changes at:
      #      https://<owner>.github.io/<repo>/pr-{number}/
      #
      #    Runs on opened, synchronize (new push), and reopened events.
      #    Does NOT run on 'closed' — that's handled by the cleanup step below.
      # -----------------------------------------------------------------------
      - name: Deploy PR preview (/pr-${{ github.event.number }}) 🚀
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'dev' &&
          github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: examples
          target-folder: pr-${{ github.event.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false

      # -----------------------------------------------------------------------
      # 8. POST/UPDATE PR COMMENT with the preview URL
      #
      #    Uses a find-and-update pattern: on the first deploy it creates a
      #    comment; on subsequent pushes it finds the existing comment (by
      #    matching a hidden marker) and updates it instead of creating
      #    duplicates. The comment includes the deployment timestamp so
      #    reviewers can tell when it was last refreshed.
      # -----------------------------------------------------------------------
      - name: Comment PR with deployment URL 💬
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'dev' &&
          github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.number;
            const deploymentUrl = `https://${owner}.github.io/${repo}/pr-${prNumber}/`;
            const timestamp = new Date().toISOString();

            // Hidden HTML marker used to identify our comment on future runs.
            const marker = '<!-- gh-pages-preview-comment -->';

            const body = [
              marker,
              `🚀 **Preview Deployment Ready!**`,
              ``,
              `Your changes have been deployed to: ${deploymentUrl}`,
              ``,
              `_Last updated: ${timestamp}_`,
            ].join('\n');

            // Search for an existing preview comment on this PR.
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              // Update the existing comment in place (no duplicates).
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              // First deploy — create a new comment.
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }

      # -----------------------------------------------------------------------
      # 9. CLEAN UP PR PREVIEW on close
      #
      #    When a PR targeting dev is closed (merged or not), we delete the
      #    /pr-{number} directory from the gh-pages branch.
      #
      #    Strategy: check out the gh-pages branch, remove the directory,
      #    and force-push. The deploy action can't do this — it deploys
      #    content *to* a folder but can't remove one entirely.
      # -----------------------------------------------------------------------
      - name: Clean up PR preview on close 🧹
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.base.ref == 'dev'
        run: |
          PR_FOLDER="pr-${{ github.event.number }}"

          # Clone only the gh-pages branch (shallow for speed).
          git clone --depth 1 --single-branch --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages-cleanup

          cd gh-pages-cleanup

          # If the PR folder doesn't exist, nothing to do.
          if [ ! -d "$PR_FOLDER" ]; then
            echo "No $PR_FOLDER directory found on gh-pages — nothing to clean up."
            exit 0
          fi

          # Remove the PR preview directory and commit the deletion.
          git rm -rf "$PR_FOLDER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove preview for PR #${{ github.event.number }}"
          git push origin gh-pages
