# This workflow will build and push a new version of the site to the gh-pages branch
# after a new version of the site is built and pushed to the master branch.
# Main/dev pushes deploy to root, PRs to dev deploy to /pr-{number} subdirectories.
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-html-sites

name: Build and Deploy

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]
  pull_request:
    branches:
      - dev
      - main
    types: [closed]
  push:
    branches:
      - main
      - dev
    # This will only trigger if someone has direct push access (admins/maintainers)

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      - name: Update deployment timestamp
        run: |
          # Update the timestamp in index.html
          node -e "const fs=require('fs'); const html=fs.readFileSync('examples/index.html','utf8'); fs.writeFileSync('examples/index.html', html.replace('DEPLOYMENT_TIMESTAMP_PLACEHOLDER', new Date().toISOString()));"

      - name: Deploy to main branch (root) 🚀
        if: |
          (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: examples
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false

      - name: Deploy to dev branch deployment 🚀
        if: |
          (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: examples
          target-folder: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false

      - name: Deploy to PR subdirectory (open PRs to dev) 🚀
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' && github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: examples
          target-folder: pr-${{ github.event.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' && github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.number;
            const deploymentUrl = `https://${owner}.github.io/${repo}/pr-${prNumber}/`;
            
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `🚀 **Preview Deployment Ready!**\n\nYour changes have been deployed to: ${deploymentUrl}\n\n_This preview will be updated automatically with each new commit to this PR._`
            });

